name: Refresh Jamaal Letter and deploy site
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read RSS and refresh both post lists
        run: python scripts/update-letter-posts.py --manifest /tmp/letter-posts-manifest.json
      - name: Commit only changed newsletter lists
        id: refresh
        shell: bash
        run: |
          if git diff --quiet -- index.html newsletter.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html newsletter.html
            git commit -m 'Refresh Jamaal Letter posts from RSS'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Pages
        if: steps.refresh.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - name: Prepare only website content for deployment
        if: steps.refresh.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p /tmp/pages-site
          git ls-files -z | python -c 'import sys,pathlib,shutil; out=pathlib.Path("/tmp/pages-site"); files=sys.stdin.buffer.read().decode().split("\0"); [(lambda p: ( (out/p).parent.mkdir(parents=True,exist_ok=True), shutil.copy2(p,out/p)))(pathlib.Path(f)) for f in files if f and not f.startswith((".github/","scripts/")) and pathlib.Path(f).is_file()]'
      - name: Upload Pages artifact
        if: steps.refresh.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages-site
      - name: Deploy Pages in this run
        if: steps.refresh.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed homepage and Newsletter list order
        if: steps.refresh.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if python scripts/update-letter-posts.py --manifest /tmp/letter-posts-manifest.json --verify-base "$SITE_URL"; then
              exit 0
            fi
            sleep 20
          done
          echo 'Deployment verification failed.' >&2
          exit 1
      - name: Write run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pathlib
          path=pathlib.Path('/tmp/letter-posts-manifest.json')
          if path.exists():
            m=json.loads(path.read_text())
            print('## RSS refresh')
            print('Feed:',m['feed'])
            print('Updated lists:',m['changed'])
            for p in m['added']:print('- '+p['title']+' - '+p['url'])
          PY
